name: Publicar arte

# Arte pronta: voce entrega o arquivo, o pipeline entrega o post.
#
# CADENCIA MORA NA MARCA, NAO AQUI. O cron roda todo dia as 09:00 de Brasilia
# (12:00 UTC) e cada perfil decide se hoje e dia dele, pelo `dias_da_semana` do
# seu brands/<marca>.json (0 = segunda). Um post por perfil por rodada.
#
# A versao anterior fixava seg/qua/sex no proprio cron. Com mais de um perfil
# isso obriga a editar YAML para mudar o ritmo de um so, e um cron por perfil
# viraria N workflows iguais. Ritmo e config de marca; agendamento e infra.
#
# Disparo manual ignora a cadencia de proposito: e a valvula de escape para
# publicar agora, num dia que nao e o do perfil.
on:
  schedule:
    # 12, 15, 18 e 21 UTC = 09h, 12h, 15h e 18h em Brasilia.
    #
    # QUATRO RODADAS, NAO QUATRO POSTS. Quantos posts cada marca faz por dia e
    # `posts_por_dia` no brands/<marca>.json; o arte.py conta no estado/ quantos
    # ja sairam hoje e recusa quando a cota fecha. Marca sem o campo vale 1, e
    # por isso lentesvidya e alfalentes seguem com um post por dia de cadencia
    # mesmo com o cron acordando quatro vezes -- tres dessas rodadas vao achar
    # a cota cumprida e sair verdes.
    #
    # Nenhum destes minutos coincide com publicar.yml (10:30) nem com
    # publicar-t1.yml (:30), e todos caem no MESMO dia UTC -- a cota compara
    # data UTC, e um slot depois da meia-noite UTC zeraria a conta no meio da
    # tarde de Brasilia.
    - cron: '0 12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      marca:
        description: 'Perfil de destino'
        type: choice
        options: [estilovidya, lentesvidya, alfalentes]
        default: estilovidya
      dry_run:
        description: 'Validar e subir a midia, sem publicar'
        type: boolean
        default: false

concurrency:
  group: publicar-arte
  cancel-in-progress: false

# NOTA DE MANUTENCAO
#
# Nenhum passo usa $(...) nem variavel de shell, pela mesma razao do publicar.yml.
#
# UM GUARDA SO. Numa rodada agendada todos os perfis entram; num disparo
# manual, so o escolhido. Em vez de repetir a condicao em cada passo, ela vive em
# `env.PROCESSAR` e guarda apenas o primeiro passo: se `preparar` nao roda,
# `tem_post` fica vazio e todo o resto pula junto.
#
# SEGREDO POR MARCA. `secrets[format('IG_ACCESS_TOKEN_{0}', ...)]` monta o nome
# a partir do slug: estilovidya -> IG_ACCESS_TOKEN_ESTILOVIDYA. Nomes de secret
# no GitHub sao guardados em maiuscula e a busca no contexto `secrets` nao
# diferencia caixa. Se algum dia diferenciar, a falha e alta e imediata:
# `publicar.py` para com "falta a variavel de ambiente IG_ACCESS_TOKEN".
#
# FILA VAZIA x ARTE INVALIDA. O `arte.py` nao usa codigo de saida para
# distinguir os dois -- `outcome` nao separa "nao havia nada" de "o que havia
# esta quebrado". Ele escreve `tem_post` em GITHUB_OUTPUT e sai 1 so quando a
# arte e invalida. Fila vazia fica verde; JPEG que nao e JPEG fica vermelho.
#
# max-parallel: 1 porque os dois perfis fazem commit no mesmo repositorio.

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        marca: [estilovidya, lentesvidya, alfalentes]

    env:
      PROCESSAR: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.marca == matrix.marca }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        if: env.PROCESSAR == 'true'
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # `command -v` falha o passo se o binario nao existir. Sem ffprobe a
          # duracao do Reel nao e conferida aqui, e o erro so apareceria como
          # recusa crua da API depois do upload.
          command -v ffprobe

      - name: Preparar a arte da fila
        id: preparar
        if: env.PROCESSAR == 'true'
        run: python arte.py preparar ${{ matrix.marca }}

      - name: Publicar
        id: publicar
        if: steps.preparar.outputs.tem_post == 'true' && github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID:      ${{ secrets[format('IG_USER_ID_{0}', matrix.marca)] }}
          IG_ACCESS_TOKEN: ${{ secrets[format('IG_ACCESS_TOKEN_{0}', matrix.marca)] }}
          GITHUB_TOKEN:    ${{ github.token }}
          GH_OWNER:        ${{ github.repository_owner }}
          GH_REPO:         ${{ github.event.repository.name }}
        run: python publicar.py --ultima ${{ matrix.marca }}

      - name: So validar (dry run)
        if: steps.preparar.outputs.tem_post == 'true' && github.event.inputs.dry_run == 'true'
        env:
          IG_USER_ID:      ${{ secrets[format('IG_USER_ID_{0}', matrix.marca)] }}
          IG_ACCESS_TOKEN: ${{ secrets[format('IG_ACCESS_TOKEN_{0}', matrix.marca)] }}
          GITHUB_TOKEN:    ${{ github.token }}
          GH_OWNER:        ${{ github.repository_owner }}
          GH_REPO:         ${{ github.event.repository.name }}
        run: python publicar.py --ultima ${{ matrix.marca }} --dry-run

      # Registra no mesmo estado/<marca>.json que o coletor de metricas le.
      # E o que tira a pasta da fila e o que faz a arte entrar na serie de
      # desempenho sem uma linha de codigo nova.
      # Registra E TIRA DA FILA, na ordem certa: o `limpar_fila.py` so remove
      # depois de existir registro com media_id, entao rodar o registrar antes
      # dele nao e detalhe de estilo, e o que autoriza a remocao.
      #
      # O `git add -A entrada/` e o que faz a remocao virar commit. Sem ele o
      # arquivo sai do runner e volta no checkout seguinte, e a fila nunca
      # encolheria de verdade.
      - name: Registrar o post e tirar da fila
        if: steps.publicar.outcome == 'success' && github.event.inputs.dry_run != 'true'
        run: |
          python arte.py registrar ${{ matrix.marca }}
          python limpar_fila.py ${{ matrix.marca }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f estado/ || true
          git add -A entrada/ || true
          git commit -m "estado: arte publicada; fila: pasta removida" || echo "sem mudanca"
          git pull --rebase --autostash
          git push

      - name: Fila vazia
        if: env.PROCESSAR == 'true' && steps.preparar.outputs.tem_post != 'true'
        run: echo "Nao havia pasta nova em entrada/ para esta marca."
