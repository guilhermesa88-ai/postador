name: Publicar carrossel

# Roda de segunda a sexta as 07:30 em Brasilia (UTC-3 -> 10:30 UTC).
# workflow_dispatch permite disparar na mao para testar.
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'So renderizar e subir a midia, sem publicar'
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false     # nunca dois posts ao mesmo tempo

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write           # para commitar a midia no proprio repo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install jinja2 playwright requests jsonschema anthropic
          playwright install --with-deps chromium

      - name: Fonte Poppins
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-poppins || {
            mkdir -p /tmp/p && cd /tmp/p
            for w in Regular Medium Bold Light; do
              curl -sSL -o "Poppins-$w.ttf" \
                "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf"
            done
            sudo mkdir -p /usr/share/fonts/truetype/poppins
            sudo cp *.ttf /usr/share/fonts/truetype/poppins/
          }
          sudo fc-cache -f
          fc-list | grep -i poppins | head -3

      - name: Testes dos validadores
        run: python test_validators.py

      - name: Compor o brief a partir dos facts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python compose.py facts/${{ vars.FACTS_ATUAL }} ${{ vars.MARCA }}

      - name: Renderizar os slides
        run: |
          BRIEF=$(ls -t briefs/${{ vars.MARCA }}-*.json | head -1)
          echo "brief: $BRIEF"
          python render.py "$BRIEF"

      - name: Publicar
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN:    ${{ github.token }}
          GH_OWNER:        ${{ github.repository_owner }}
          GH_REPO:         ${{ github.event.repository.name }}
        run: |
          PASTA=$(ls -td out/${{ vars.MARCA }}/*/ | head -1)
          echo "pasta: $PASTA"
          python publicar.py "$PASTA"

      - name: Guardar o registro do post
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-${{ github.run_number }}
          path: |
            out/**/manifest.json
            out/**/resultado.json
            out/**/*.jpg
          retention-days: 30
