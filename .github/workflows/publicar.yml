name: Publicar carrossel

# Roda de segunda a sexta as 07:30 em Brasilia (UTC-3 -> 10:30 UTC).
on:
  schedule:
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Ingerir, compor, renderizar e subir a midia, sem publicar'
        type: boolean
        default: false
      formato:
        description: 'O que publicar'
        type: choice
        options: [reel, carrossel]
        default: reel
      forcar:
        description: 'Publicar mesmo que este informe ja tenha virado post'
        type: boolean
        default: false

concurrency:
  group: publicar
  cancel-in-progress: false

# NOTA DE MANUTENCAO
# Nenhum passo abaixo usa $(...) nem variavel de shell. A versao anterior usava,
# e um backslash a mais na hora de gravar o arquivo virou `\$(ls -t ...)` no
# repositorio: o YAML aceitou, o shell nao, e o pipeline morreu no render depois
# de ja ter gasto a chamada do modelo. Quem precisa achar "o mais recente" agora
# e o proprio Python (render.py --ultimo / publicar.py --ultima), onde a logica
# e testavel e nao passa por camada de escape. Mantenha assim.
#
# A guarda tambem segue essa regra: em vez de capturar codigo de saida em
# variavel, ela usa `continue-on-error` e os passos seguintes olham para
# `steps.guarda.outcome`. Sem novidade, o job termina verde sem publicar.

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install jinja2 playwright requests jsonschema anthropic pdfplumber
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          # `command -v` falha o passo se o binario nao existir. A versao
          # anterior conferia com `ffmpeg -version | head -1`: como o `head`
          # sai 0, o pipeline inteiro saia 0 mesmo sem ffmpeg instalado, e o
          # run so morria la na frente, no Reel. Check que nao pode falhar
          # nao e check.
          command -v ffmpeg

      # Poppins nao existe como pacote apt no runner. Baixo os cinco pesos do
      # repositorio oficial do Google Fonts, um curl por arquivo -- sem loop,
      # porque loop pede variavel de shell e e exatamente isso que ja quebrou
      # este workflow uma vez. Falha aqui derruba o run de proposito: sem a
      # fonte o slide sai com fallback e a identidade visual muda sem aviso.
      - name: Fonte Poppins
        run: |
          mkdir -p /tmp/poppins
          cd /tmp/poppins
          curl -fsSLO https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Light.ttf
          curl -fsSLO https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Regular.ttf
          curl -fsSLO https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Medium.ttf
          curl -fsSLO https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-SemiBold.ttf
          curl -fsSLO https://raw.githubusercontent.com/google/fonts/main/ofl/poppins/Poppins-Bold.ttf
          sudo mkdir -p /usr/share/fonts/truetype/poppins
          sudo cp /tmp/poppins/*.ttf /usr/share/fonts/truetype/poppins/
          sudo fc-cache -f
          fc-list | grep -i poppins | head -5
          fc-list | grep -qi poppins

      - name: Testes dos validadores
        run: python test_validators.py

      - name: Ingerir o informe do FipeZap
        run: python ingest_fipezap.py

      # A guarda roda ANTES do compose de proposito: se nao ha o que dizer, nao
      # se gasta a chamada do modelo. Sai 78 quando este informe ja virou post
      # no mesmo angulo; `continue-on-error` transforma isso em "pula o resto",
      # nao em falha do job.
      - name: Ha o que dizer hoje?
        id: guarda
        continue-on-error: true
        run: python guarda.py facts/fipezap-capitais.json ${{ vars.MARCA }} --angulo padrao ${{ github.event.inputs.forcar == 'true' && '--forcar' || '' }}

      - name: Compor o brief a partir dos facts
        if: steps.guarda.outcome == 'success'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANGULO: padrao
        run: python compose.py facts/fipezap-capitais.json ${{ vars.MARCA }}

      # Versiona o que a maquina leu (facts) e o que ela escreveu (brief).
      # Serve para conferir numero por numero contra o PDF antes de publicar,
      # ter historico da serie e do editorial no git, e nao depender de baixar
      # artifact para ler qualquer um dos dois. Roda mesmo se o compose falhar:
      # nesse caso o brief nao existe, mas os facts do dia ficam registrados.
      - name: Versionar facts e brief
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f facts/fipezap-capitais.json || true
          git add -f briefs/ || true
          git commit -m "dados: informe FipeZap e brief do dia" || echo "sem mudanca"
          git pull --rebase --autostash || true
          git push || true

      - name: Montar o Reel
        if: steps.guarda.outcome == 'success' && github.event.inputs.formato != 'carrossel'
        run: python reel.py --ultimo ${{ vars.MARCA }}

      - name: Renderizar o carrossel
        if: steps.guarda.outcome == 'success' && github.event.inputs.formato == 'carrossel'
        run: python render.py --ultimo ${{ vars.MARCA }}

      - name: Publicar
        id: publicar
        if: steps.guarda.outcome == 'success' && github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN:    ${{ github.token }}
          GH_OWNER:        ${{ github.repository_owner }}
          GH_REPO:         ${{ github.event.repository.name }}
        run: python publicar.py --ultima ${{ vars.MARCA }}

      # Registra (informe, angulo, media_id). E o que impede a rodada de amanha
      # de republicar o mesmo dado -- e o que da rastro do post de volta ao PDF.
      - name: Registrar o post
        if: steps.publicar.outcome == 'success' && github.event.inputs.dry_run != 'true'
        run: |
          python guarda.py --registrar-ultima ${{ vars.MARCA }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f estado/ || true
          git commit -m "estado: post publicado" || echo "sem mudanca"
          git pull --rebase --autostash || true
          git push || true

      - name: Sem publicacao nesta rodada
        if: steps.guarda.outcome != 'success'
        run: |
          echo "A guarda barrou esta rodada."
          echo "Se foi 'NADA NOVO', esperado: o informe do FipeZap e mensal."
          echo "Se foi traceback, e bug — leia o passo 'Ha o que dizer hoje?'."

      - name: Guardar o registro do post
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saida-${{ github.run_number }}
          path: |
            out/**/manifest.json
            out/**/resultado.json
            out/**/*.jpg
            out/**/*.mp4
            facts/fipezap-capitais.json
            briefs/*.json
            estado/*.json
          retention-days: 30
