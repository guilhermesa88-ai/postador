name: Publicar T1 (quadro progressivo)

# Cadencia PROPRIA, a cada 6 horas. Nao entra na rotacao de angulos do
# publicar.yml: o T1 nao responde uma pergunta do informe, ele expoe a lista
# ordenada inteira. Sao coisas diferentes e consomem contadores diferentes.
#
# ARITMETICA DA CADENCIA -- leia antes de esperar 4 posts por dia.
#
# Este cron acorda 4x/dia. O T1 rende TRES posts por informe (um por
# horizonte: mensal, ano, doze_meses) e o informe do FipeZap e MENSAL. Ou
# seja: quando um informe novo entra, esta rodada drena os tres em menos de
# um dia; depois disso ela acorda, nao acha horizonte livre, imprime "nada a
# publicar" e sai VERDE por ~29 dias.
#
# Isso e de proposito, e nao e desperdicio: cron nao cria conteudo. O gargalo
# e o suprimento de facts, nao o agendamento. Quem quiser 4 posts/dia de
# verdade precisa de mais fonte (locacao alem de venda, serie historica,
# bairros de BH), nao de cron mais curto.
#
# O que este agendamento COMPRA e latencia: informe novo vira post em no
# maximo 6 horas, sem ninguem clicar.

on:
  schedule:
    # 00:30, 06:30, 12:30 e 18:30 UTC -- 6 horas exatas, com 30 minutos de
    # deslocamento DE PROPOSITO.
    #
    # `0 */6 * * *` cairia as 12:00 UTC, que e o minuto exato do cron do
    # publicar.yml. Os dois workflows tem grupos de concorrencia diferentes
    # (nao se serializam), escrevem os dois em estado/ e dao push, e usam o
    # MESMO token do Instagram. Rodar no mesmo minuto e corrida de push e
    # duas publicacoes simultaneas na mesma conta.
    #
    # 30 minutos resolve sem inventar mecanismo novo. Em Brasilia da 21:30,
    # 03:30, 09:30 e 15:30 -- o slot das 03:30 e fraco; se quiser trocar 6h
    # exatas por quatro horarios todos diurnos, use '30 12,15,18,21 * * *'
    # (09:30, 12:30, 15:30 e 18:30 em Brasilia).
    - cron: '30 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      horizonte:
        description: 'Forcar um horizonte (vazio = o proximo nao publicado)'
        type: choice
        options: ['', 'mensal', 'ano', 'doze_meses']
        default: ''
      dry_run:
        description: 'Gerar o reel e NAO publicar'
        type: boolean
        default: false

concurrency:
  group: publicar-t1
  cancel-in-progress: false

# NOTA DE MANUTENCAO
#
# Mesma regra dos outros: nenhum passo usa $(...) nem variavel de shell. Ver
# a nota do publicar.yml -- `ffmpeg -version | head -1` saia 0 sem ffmpeg
# instalado, e check que nao pode falhar nao e check.
#
# A ORDEM DOS PASSOS IMPORTA. "Baixar a voz" vem ANTES de "Gerar o reel",
# como passo nomeado, para que falha de rede no HuggingFace apareca como
# falha de rede e nao como erro obscuro no meio da geracao. E logo depois vem
# o passo de fumaca, que sintetiza de verdade: e ele que prova que a voz
# funciona nesta rodada, em vez de a gente supor que a URL continua certa.
#
# SEM voz de producao o job FALHA em vez de cair para o espeak. Voz robotica
# publicada e pior que silencio, e fallback silencioso e o defeito que este
# projeto mais repetiu.

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install jinja2 playwright requests jsonschema anthropic pdfplumber
          pip install piper-tts num2words
          playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v ffprobe

      # O modelo do piper nao vai para o repositorio (60MB de binario num
      # repo de codigo), entao e cache mais download.
      - name: Cache da voz
        uses: actions/cache@v4
        with:
          path: vozes
          key: piper-pt-BR-faber-medium-v1

      - name: Baixar a voz
        run: python baixar_voz.py

      # Passo de fumaca. O baixar_voz.py ja sintetiza uma frase, mas este
      # confere o caminho que o reel realmente usa: narracao.escolher_voz().
      # Se ele escolher espeak aqui, o proximo passo falharia sozinho -- mas
      # falharia depois de gastar minutos gerando video. Melhor agora.
      - name: Conferir que a voz de producao esta ativa
        run: |
          python narracao.py "Conferindo a voz de producao."
          python -c "
          import narracao
          v = narracao.escolher_voz()
          print(f'voz ativa: {v.nome} producao={v.producao}')
          narracao.ok_para_publicar(v)
          "

      - name: Ingerir o informe do FipeZap
        run: python ingest_fipezap.py

      # Gera o reel. Sai 0 sem gerar nada quando os tres horizontes ja
      # viraram post -- o que vai ser o caso na maior parte do mes. O passo
      # anota em `tem_reel` se ha o que publicar.
      - name: Gerar o quadro progressivo
        id: gerar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python quadro.py facts/fipezap-capitais.json metro-de-bh \
            --horizonte-opcional "${{ github.event.inputs.horizonte }}"

      - name: Publicar
        if: steps.gerar.outputs.tem_reel == 'true' && github.event.inputs.dry_run != 'true'
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python publicar.py --ultima metro-de-bh

      - name: Registrar o post
        if: steps.gerar.outputs.tem_reel == 'true' && github.event.inputs.dry_run != 'true'
        run: python guarda.py --registrar-ultima metro-de-bh

      - name: Sem publicacao nesta rodada
        if: steps.gerar.outputs.tem_reel != 'true'
        run: echo "nenhum horizonte livre do T1 neste informe — nada a publicar."

      - name: Guardar o registro
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A estado/ facts/ briefs/ || true
          git commit -m "t1: registro da rodada" || echo "sem mudanca"
          git pull --rebase --autostash
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t1-${{ github.run_number }}
          path: |
            out/metro-de-bh/**
          retention-days: 14
          if-no-files-found: ignore
