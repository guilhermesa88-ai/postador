name: Stories EstiloVidya
on:
  schedule:
    # 08:15, 10:15, 12:15, 14:15, 16:15, 18:15, 20:15, 22:15 Brasilia.
    # 01:15 UTC pertence ao dia anterior em Brasilia. Actions pode atrasar.
    - cron: '15 1,11,13,15,17,19,21,23 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar uma sequencia aprovada (config enabled precisa ser true)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: stories-estilovidya
  cancel-in-progress: false
jobs:
  stories:
    if: github.repository == 'guilhermesa88-ai/postador' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-stories.txt
      - name: Testes
        run: python -m unittest discover -s tests_stories -v
      - name: Validar fila sem publicar
        run: python stories.py
      - name: Configurar recibos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Publicar no maximo uma sequencia
        if: github.event_name == 'schedule' || inputs.publish == true
        env:
          IG_USER_ID_ESTILOVIDYA: ${{ secrets.IG_USER_ID_ESTILOVIDYA }}
          IG_ACCESS_TOKEN_ESTILOVIDYA: ${{ secrets.IG_ACCESS_TOKEN_ESTILOVIDYA }}
        run: python stories.py --publish
      - name: Guardar recibo mesmo em caso de falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recibo-stories-${{ github.run_id }}-${{ github.run_attempt }}
          path: estado/stories-estilovidya.json
          retention-days: 30
